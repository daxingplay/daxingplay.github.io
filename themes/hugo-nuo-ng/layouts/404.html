{{ define "title" }}{{ i18n "pageNotFound" }}{{ end }}

{{ define "main" }}
  {{ $script := resources.Get "scripts/index.js" | resources.Minify }}
  <div class="not-found">
    <h1 class="error-emoji"></h1>
    <p class="error-text">{{ i18n "notFoundText" }}</p>
    <p class="error-link"><a href="{{ .Site.Home.RelPermalink }}">{{ i18n "backHome" }}</a></p>
  </div>
  <script src="{{ $script.RelPermalink }}"></script>
{{ end }}
